<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CEO POR 1 DIA — Simulador de laticínios</title>
  <meta name="description" content="Suas decisões podem salvar ou destruir uma indústria de laticínios.">
  <link rel="icon" href="assets/icons/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/reset.css">
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/header.css">
  <link rel="stylesheet" href="css/dashboard.css">
  <link rel="stylesheet" href="css/questions.css">
  <link rel="stylesheet" href="css/emergency.css">
  <link rel="stylesheet" href="css/timer.css">
  <link rel="stylesheet" href="css/animations.css">
  <link rel="stylesheet" href="css/ranking.css">
  <link rel="stylesheet" href="css/results.css">
  <link rel="stylesheet" href="css/ajuda.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
  <div id="banners" class="banners" role="status" aria-live="polite"></div>

  <!-- Barra fixa: cabeçalho + 4 indicadores (visível durante perguntas e emergências) -->
  <div id="barra-fixa" class="barra-fixa" hidden>
    <header id="cabecalho" class="cabecalho"></header>
    <section id="indicadores" class="indicadores" aria-label="Indicadores da empresa"></section>
  </div>

  <main id="app" class="app">
    <section id="tela-inicio" class="tela" hidden></section>
    <section id="tela-jogo" class="tela" hidden><div id="area-jogo"></div></section>
    <section id="tela-espera" class="tela" hidden></section>
    <section id="tela-ranking" class="tela" hidden></section>
    <section id="tela-resultado" class="tela" hidden></section>
    <section id="tela-erro" class="tela" hidden></section>
  </main>

  <!-- Como funciona: lateral direita (telas largas) ou no fim da página, recolhido (telas estreitas) -->
  <aside id="ajuda" class="ajuda" hidden aria-label="Como funciona"></aside>

  <div id="modal" class="modal" hidden role="dialog" aria-modal="true"></div>
  <noscript><p style="padding:2rem">Este jogo precisa de JavaScript habilitado.</p></noscript>
  <script type="module" src="js/app.js"></script>
</body>
</html>
